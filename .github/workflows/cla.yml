# ═════════════════════════════════════════════════════════════════════════════
# DeskNode — signature du CLA sur la première pull request.
#
#   `CONTRIBUTING.md` promet depuis le 2026-08-31 qu'« un bot s'en occupe en un
#   clic ». Ce fichier est l'artefact de cette promesse : jusqu'au 2026-09-02,
#   il n'y avait AUCUN fichier sous `.github/`, et la promesse était creuse.
#
# ── CE QUI EST MESURÉ, ET QUI VAUT D'ÊTRE ÉCRIT ──────────────────────────────
#
# ⚠️ `contributor-assistant/github-action` est ARCHIVÉ (dernier push 2026-03-23,
#    dernière release `v2.6.1` du 2024-09-26 — relevé à l'API GitHub le
#    2026-09-02). Une Action d'un dépôt archivé s'exécute encore ; elle n'est
#    simplement plus corrigée. ⇒ la version est ÉPINGLÉE, ⛔ jamais `@v2`
#    flottant : sur un dépôt archivé un tag mobile ne bougera plus, mais
#    l'épingle DIT ce qu'on exécute.
#
# ⚠️ Le magasin de signatures est DANS CE DÉPÔT (`path-to-signatures`), ce qui
#    permet au `GITHUB_TOKEN` de suffire : ⛔ aucun `PERSONAL_ACCESS_TOKEN` à
#    créer. Un magasin dans un AUTRE dépôt en exigerait un.
#
# 🔴 `pull_request_target` s'exécute avec le jeton du dépôt de BASE — c'est ce
#    qui lui permet d'écrire le magasin depuis une PR de fork. C'est aussi une
#    surface connue : ⛔ CE WORKFLOW NE CHECKOUTE JAMAIS LE CODE DE LA PR.
#    Il n'y a délibérément aucun `actions/checkout` ici.
#
# ⛔ CE FICHIER N'EST PAS DE LA CI. Faire tourner `tools/run_gates.sh` sans que
#    personne y pense est `dn4-39` ; les gabarits d'issues et de PR sont `dn8`.
#    Voir `docs/roadmap.md`.
# ═════════════════════════════════════════════════════════════════════════════
name: CLA

on:
  # Le commentaire de signature du contributeur.
  issue_comment:
    types: [created]
  # ⚠️ `pull_request_target`, ⛔ pas `pull_request` : sur une PR de fork,
  #    `pull_request` n'aurait pas le droit d'écrire le magasin.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # ⛔ UN JOB QUI ÉCRIT DANS `main` NE DOIT PAS SE DOUBLER. L'essai du
    #    2026-09-02 a relevé que le bot **écrit dans le dépôt** (commit
    #    `bfd63ae`, poussé sur `main` par `github-actions[bot]`). `synchronize`
    #    puis `issue_comment` se recouvrent trivialement — on pousse, puis on
    #    commente — et deux runs qui muent `.github/cla-signatures.json` sur une
    #    branche NON PROTÉGÉE peuvent **perdre une signature**.
    #    ⛔ `cancel-in-progress: false` : ⛔ on n'annule pas un run qui écrit.
    concurrency:
      group: >-
        cla-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    # ⚠️ Le défaut de `ubuntu-latest` est **360 minutes**. Sur un dépôt PRIVÉ
    #    facturé à la minute, un job bloqué consommerait jusqu'à six heures
    #    contre un coût mesuré de **2,0 minutes** — le run le plus long de
    #    l'essai a duré 31 s cumulées sur trois runs.
    timeout-minutes: 5
    # 🔴 LA CONDITION EST AU NIVEAU DU **JOB**, ⛔ PAS DE L'ÉTAPE — ET C'EST UNE
    #    MESURE, ⛔ pas un style. L'essai du 2026-09-02 a produit TROIS runs pour
    #    une seule PR : `opened`, `closed`… et un `issue_comment` déclenché par un
    #    commentaire QUI N'AVAIT RIEN À VOIR avec une signature. Avec la condition
    #    sur l'ÉTAPE, le runner démarrait quand même et les minutes étaient
    #    DÉCOMPTÉES (dépôt privé) avant que l'étape ne soit sautée. Au niveau du
    #    job, GitHub n'alloue aucun runner : le job est `skipped`, à coût nul.
    # ⛔ `== 'recheck'` EXIGEAIT LA CHAÎNE NUE. `CONTRIBUTING.md` dit au
    #    contributeur de commenter `recheck` : une espace finale, un retour à la
    #    ligne ou des accents graves faisaient tomber la condition — et comme
    #    elle est au niveau du JOB, il ne se passait RIEN DU TOUT, sans message.
    #    `contains` accepte la phrase telle qu'un humain la poste. Prix assumé :
    #    un commentaire qui contient le mot alloue un runner.
    # 🔴 ⛔ AUCUN `#` NE DESCEND DANS LE BLOC `>-` CI-DESSOUS, ET C'EST UNE
    #    MESURE, ⛔ pas un style : dans un scalaire REPLIÉ, `#` n'est PAS un
    #    commentaire — c'est du TEXTE, il entre dans l'expression, et GitHub
    #    refuse le fichier (« Invalid workflow file »). Payé le 2026-09-04 :
    #    `yaml.safe_load` passait VERT parce qu'il ne voit qu'une chaîne, et
    #    c'est le premier `push` qui l'a dit — run en `failure` sur `main`.
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && (contains(github.event.comment.body,
                       'I have read the CLA Document and I hereby sign the CLA')
              || contains(github.event.comment.body, 'recheck')))
    steps:
      - name: "Signature du CLA"
        # ⛔ VERSION ÉPINGLÉE — voir l'en-tête : le dépôt de l'action est archivé.
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Le magasin vit dans ce dépôt ⇒ le GITHUB_TOKEN suffit.
          path-to-signatures: '.github/cla-signatures.json'
          # 🔴 Le document DOIT exister : un bot qui fait signer un document
          #    absent est exactement la promesse creuse que `dn5-2` solde.
          path-to-document: 'https://github.com/nasbarok/desknode/blob/3cffb948f0d3e4ee1bdcb92935d01ca5238e9cf6/CLA.md'
          branch: 'main'
          allowlist: 'dependabot[bot]'
