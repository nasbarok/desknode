# ═════════════════════════════════════════════════════════════════════════════
# DeskNode — LES GATES S'INVOQUENT SANS QU'ON Y PENSE.  (`dn4-39`)
#
#   `tests/README.md` publie que « LA vérification rejouable, ce sont les
#   gates ». Jusqu'au 2026-09-02 **RIEN NE LES INVOQUAIT** : ni CI, ni hook, ni
#   procédure. Ce fichier est ce qui les invoque.
#
# ── ⛔ CE QUE CE FICHIER N'EST PAS ───────────────────────────────────────────
#
# ⛔ CE N'EST PAS `cla.yml`, et la frontière est AU NOM DE FICHIER. Ajouter un
#    job de gates à `cla.yml` les ferait tourner sur CHAQUE COMMENTAIRE D'ISSUE
#    — mesuré le 2026-09-02 : un `issue_comment` sans rapport a démarré un
#    runner. Et ça facturerait.
#
# ⛔ CE N'EST PAS UN HOOK, et ce n'est pas un repli. `CONTRIBUTING.md` publie
#    pourquoi : `.git/hooks/` **n'est pas cloné**, il garderait ce checkout et
#    aucun autre — « l'apparence d'une garde, sans sa portée ».
#
# ⛔ CE N'EST PAS UN BUILD DE FIRMWARE. ESP-IDF et les 186 Mo de
#    `managed_components/` sont `dn5-4`. Les gates qui en dépendent sont
#    DÉCLARÉES NON-JOUABLES avec leur motif — ⛔ pas sautées.
#
#    ⚠️ DATÉ LE 2026-09-04 (`dn5-4`) — ⛔ PAS RÉÉCRIT. Sa CONCLUSION reste vraie
#    (ce fichier ne construit toujours rien : 3 étapes, 0 appel à `idf.py`), mais
#    elle DÉSIGNE UN PORTEUR QUI NE L'EST PLUS.
#    🔴 ET SON CHIFFRE EST FAUX — corrigé à la revue de code du 2026-09-04, qui a
#    relevé que l'annotation ci-dessus validait (« la phrase reste vraie ») une
#    ligne que le bloc ajouté quatorze lignes plus bas réfutait dans le même
#    commit : `managed_components/` pèse **172,5 MiB** (180 833 448 o), ⛔ pas
#    186 Mo. La ligne d'origine est conservée au-dessus, ⛔ pas effacée. `dn5-4` a mesuré
#    le build à froid et a passé le sujet « la CI construit le firmware » à
#    **`dn4-45`**, ouverte au tracker le 2026-09-04. ⇒ le porteur à suivre est
#    `dn4-45`, ⛔ plus `dn5-4`.
#
#    🔬 CE QUE `dn5-4` A MESURÉ, ET QUI CHIFFRE LA FAISABILITÉ — ⛔ pas une
#    intention. Un runner devrait installer ESP-IDF v5.5.5 (**3,84 Gio**,
#    23 sous-modules) + ses toolchains (**3,73 Gio** sous `tools/`, **4,30 Gio**
#    avec l'environnement Python), puis tirer **172,5 MiB** de composants. Le build
#    à froid lui-même prend **292,4 s** (118,7 s de résolution + 173,7 s de
#    compilation) sur un poste de 16 cœurs, hors installation.
#    🔴 ET UN FAIT QUI DÉCIDE PLUS QUE LES TAILLES : **le build à froid EXIGE LE
#    RÉSEAU, et un cache local NE LE SAUVE PAS.** `dependencies.lock` est
#    gitignoré ⇒ un clone neuf doit RÉSOUDRE, et résoudre interroge le registre.
#    Mesuré hors ligne avec un cache de 172,5 MiB complet : `rc=2`, même échec
#    qu'avec un cache vide. ⇒ un runner sans accès à `components.espressif.com`
#    ne construira pas, quelle que soit sa mise en cache.
#
# ── CE QUI EST MESURÉ, ET QUI VAUT D'ÊTRE ÉCRIT ──────────────────────────────
#
# 🔴 LE VERDICT DE LA CI N'EST PAS CELUI DU POSTE, ET L'ÉCART EST MESURÉ.
#    Sur la machine de l'auteur : **25 VERTE / 1 ROUGE / 1 NON-JOUABLE**.
#    ⚠️ DATÉ LE 2026-09-04 À LA REVUE DE CODE — ⛔ CE CHIFFRE N'EST PLUS CELUI
#    QU'ON MESURE, et il est conservé plutôt qu'effacé. Les captures de `dn5-4`
#    (`mesures/dn5-4/T0-gates-avant.txt` et `T7-gates-apres.txt`), avant ET après
#    la marche, rendent toutes deux **27 VERTE / 1 ROUGE / 1 NON-JOUABLE sur
#    29 gates**. ⛔ Ne pas recopier un compte ici : le nombre de gates monte à
#    chaque story, et la seule source est la ligne `BILAN` que l'outil imprime.
#    Dans un clone neuf avec un `HOME` étranger (2026-09-02, avant `dn4-39`) :
#    **21 VERTE / 5 ROUGE / 1 NON-JOUABLE** — cinq rouges dont AUCUN ne parle du
#    code. Un SIXIÈME ne se voyait que dans le code (chemins ABSOLUS).
#    ⇒ Une CI naïve aurait été rouge dès son premier run, et pour toujours.
#    Et « une CI rouge en permanence n'est pas une garde, c'est un bruit qu'on
#    apprend à ignorer » — c'est déjà écrit dans `tests/README.md`.
#
# ⇒ LA RÉPONSE N'EST NI `continue-on-error`, NI `|| true`, NI UNE LISTE
#   D'EXCLUSION. C'est la table `NON_JOUABLES` de `tools/run_gates.sh` : chaque
#   gate y est DÉCLARÉE avec son MOTIF, un TÉMOIN qui est un CHEMIN, et un `rc`
#   ATTENDU. La déclaration est FALSIFIABLE dans les deux sens — témoin présent
#   ⇒ la gate est JOUÉE ; `rc` démenti ⇒ le runner sort en 1.
#
# 🔴 UN SEUL JOB, ⛔ AUCUNE MATRICE. GitHub facture à la MINUTE ENTIÈRE **et par
#    JOB** — mesuré le 2026-09-02 : 31 s réelles ⇒ 2 min facturées. Deux jobs
#    coûteraient deux fois, même s'ils durent 5 s.
#
# ⚠️ `pull_request`, ⛔ PAS `pull_request_target` — contrairement à `cla.yml`, et
#    ce n'est pas une incohérence. `cla.yml` doit ÉCRIRE le magasin de
#    signatures depuis une PR de fork. Cette CI, elle, ne doit RIEN écrire : ses
#    permissions sont en LECTURE SEULE. `pull_request_target` exécuterait du code
#    de contributeur avec le jeton du dépôt de base. Le dépôt a **0 fork**
#    aujourd'hui, donc ça ne se verrait pas — c'est précisément pour ça que
#    c'est posé MAINTENANT.
#
# ⚠️ ⛔ AUCUN `paths-ignore`, ET C'EST DÉLIBÉRÉ. Il était tentant d'exclure les
#    poussées « purement documentaires ». Mais LES GATES LISENT LA DOCUMENTATION :
#    le contrôle (c4) de `verif_licences_dn52.py` exige que tout marqueur cité
#    comme marqueur soit défini dans `docs/roadmap.md`, et `verif_dossier_dn415.py`
#    balaie toute la surface `.md`. Une poussée documentaire est EXACTEMENT le
#    moment où ces gates comptent. ⇒ un filtre les rendrait aveugles là où elles
#    servent.
#    🔴 CORRIGÉ LE 2026-09-05 (`dn5-6`, constat 9) — ⛔ LA PHRASE CI-DESSUS N'EST
#       PAS EFFACÉE, ELLE EST NOMMÉE COMME TROP LARGE. Elle affirmait de (c4)
#       une portée que ce contrôle N'AVAIT PAS : il ne lisait que les `.md` de
#       la racine et de `docs/` ⇒ un marqueur cité DANS CE FICHIER-CI n'était
#       **jamais** examiné, et la gate restait verte en le certifiant.
#       ⇒ depuis le 2026-09-05, (c4) lit AUSSI `.github/workflows/*.yml` — donc
#         ce fichier — et la portée écrite ici est enfin celle du contrôle.
#       ⚠️ L'ANCRAGE, LUI, N'A PAS BOUGÉ : seul un marqueur **renvoyé à la
#         page** est examiné. Citer `dn5-6` sans renvoyer à `docs/roadmap.md`
#         ne déclenche rien — c'est délibéré et c'est écrit sur la page.
#       ⚠️ ET LE CAS QUI AVAIT LEVÉ LE CONSTAT ÉTAIT DÉJÀ TOMBÉ : tous les
#         marqueurs cités sous `.github/` étaient définis dans la roadmap,
#         depuis que `dn5-5` a ajouté la ligne `dn4-45`. ⇒ l'élargissement
#         laisse la gate VERTE : ⛔ aucun rouge ne peut montrer ce trou. C'est
#         le mutant 34, qui REPLANTE la faute, qui le montre.
#       🔴 ⛔ NE PAS ÉCRIRE ICI LE NOMBRE DE CES MARQUEURS. Le premier jet de
#         ce bloc annonçait « les **4** marqueurs » — et **ce commit-ci en a
#         ajouté deux** (`dn5-5`, `dn5-6`, cités juste au-dessus) : le chiffre
#         était **périmé à l'arrivée, dans le fichier qui le changeait**.
#         C'est la 5ᵉ récurrence du même défaut dans cette epic. ⇒ ce qui
#         s'écrit ici est la **RÈGLE** (« tous ceux qui sont cités ici sont
#         définis là-bas »), et le COMPTE se prend par la commande :
#         `git grep -h -o -E 'dn[0-9]+-[0-9]+' -- .github | sort -u`.
#         La gate, elle, le vérifie à chaque passe — c'est son travail.
#    🔴 ET LE PIÈGE POUR PLUS TARD EST ÉCRIT ICI POUR LE JOUR OÙ IL MORDRA : un
#    filtre de chemins sur une vérification REQUISE laisse la PR **en attente
#    pour toujours**. Aujourd'hui `main` n'est pas protégée et aucune
#    vérification n'est requise, donc il ne mord pas. `dn8` protégera la branche.
#
# ⚠️ COÛT — relevé à `/users/<login>/settings/billing/usage` (⛔ PAS
#    `/settings/billing/actions`, qui rend `410 endpoint moved`). Un run de
#    gates dure ~1 min sur le poste ⇒ 1 à 2 min facturées. La franchise du plan
#    couvrait encore tout au 2026-09-02 (`netAmount` = 0.00 $).
#    ⚠️ C'est une ligne d'usage MENSUELLE : elle bouge, ⛔ elle ne se recopie pas.
#
# ⚠️ ⛔ AUCUN `pip install` — mesuré : les gates tournent sur la **stdlib**, et
#    `psutil` est couvert par `tools/stub_psutil/psutil.py`. Si un `pip` devient
#    nécessaire un jour, ça s'ÉCRIT ; ⛔ ça ne s'ajoute pas en silence.
# ═════════════════════════════════════════════════════════════════════════════
name: Gates

# 🔴 REVUE DE CODE DU 2026-09-02 — LES TAGS N'ETAIENT PAS COUVERTS.
#    Dès qu'un filtre `branches` est présent, GitHub **exclut** les références de
#    tags : le commit qui portera la version publiée aurait été le seul **sans
#    verdict**, et en silence — une absence de run ne se remarque pas. Le dépôt
#    porte **0 tag** aujourd'hui, donc ça ne mordait pas : c'est précisément
#    pour ça que c'est posé MAINTENANT, comme `pull_request_target` plus bas.
on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:

# ⛔ LECTURE SEULE. Cette CI mesure, elle n'écrit rien — ⛔ ni commit, ni
#    commentaire, ni release. `cla.yml`, lui, a besoin d'écrire ; ⛔ pas elle.
permissions:
  contents: read

# ⚠️ Une poussée qui en remplace une autre sur la MÊME référence annule la
#    précédente : des minutes en moins, et le verdict qui compte est celui du
#    dernier état. ⛔ Ça ne dédoublonne PAS push+pull_request (les références
#    diffèrent) — une branche qui porte AUSSI une PR coûte donc deux runs, et
#    c'est écrit plutôt que tu.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    # ⚠️ Une borne DURE, et elle DOMINE la borne par gate.
    # 🔴 REVUE DU 2026-09-02 — ELLE NE LA DOMINAIT PAS : le job était borné à
    #    20 min quand `run_gates.sh` accordait `timeout 1800` (30 min) PAR GATE.
    #    La borne interne était donc INATTEIGNABLE en CI — GitHub tuait le job
    #    avant, et on perdait le `BILAN`, la liste `⛔ ROUGES` et la sortie
    #    capturée que la règle (4) exige d'imprimer sur échec ; le run devenait
    #    `cancelled`, ⛔ pas `failure`, donc pas un rouge exploitable le jour où
    #    `dn8` protégera `main`.
    #    ⇒ `run_gates.sh` borne désormais chaque gate à **600 s**, et ce plafond
    #      de job reste au-dessus. Mesure du poste : 63 s pour les 27 gates.
    timeout-minutes: 20
    steps:
      - name: "Récupérer le dépôt"
        # ⛔ ÉPINGLÉ AU SHA, ⛔ jamais un tag flottant — c'est la règle que
        #    `cla.yml` a déjà posée. Un tag reste déplaçable par son éditeur ;
        #    un SHA, non. Le tag est en commentaire pour rester lisible.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # ⛔ PAS de `fetch-depth: 0` : aucune gate ne lit l'historique, et le
          #    dépôt pèse ~31,5 Mio. ⛔ PAS de `submodules` : il n'y en a aucun.
          fetch-depth: 1
          persist-credentials: false

      - name: "Ce que la CI voit — l'état est RELU, ⛔ pas supposé"
        run: |
          echo "commit   : ${GITHUB_SHA}"
          echo "python3  : $(python3 --version 2>&1)"
          echo "bash     : ${BASH_VERSION}"
          echo "cc       : $(cc --version 2>&1 | head -1)"
          echo "gates    : $(ls tools/verif_*.py | wc -l) découvertes par le glob"
          # 🔴 AJOUTÉ LE 2026-09-09 (`dn7-3`) — LE MOTEUR JavaScript EST RELEVÉ,
          #    ⛔ PAS SUPPOSÉ. `tools/verif_banc_langue_dn73.py` LANCE un banc
          #    qui exécute le `<script>` de `installeur/index.html` : sans
          #    moteur, elle rend son `rc=4` déclaré et `run_gates.sh` la porte
          #    NON-JOUABLE. ⇒ sans cette ligne, une passe resterait VERTE sur un
          #    banc qui n'a **jamais tourné** — ce que la gate elle-même appelle
          #    « pire que pas de gate ». ⛔ Rien n'est installé ici : on RELÈVE.
          # ⚠️ **UNE SEULE SONDE, ET ⛔ AUCUNE REDIRECTION.** La première version
          #    interrogeait `command -v` DEUX fois et jetait la seconde sortie
          #    vers le puits — or `tools/run_gates.sh` a **mesuré** que
          #    `command -v` n'écrit rien sur la sortie d'erreur quand il ne
          #    trouve pas : la redirection était **inutile**, et sa règle (4)
          #    l'interdit chez lui. Deux sondes, c'est aussi deux vérités
          #    possibles sur le même fait. ⇒ on relève **une fois**, on garde.
          DN_NODE="$(command -v node || true)"
          echo "node     : ${DN_NODE:-ABSENT}"
          if [ -n "${DN_NODE}" ]; then
            echo "           $(node --version) — le banc de dn7-3 EST joué"
          else
            echo "           ABSENT — verif_banc_langue_dn73.py rendra rc=4 et sera portée NON-JOUABLE"
          fi
          echo "cockpit  : ${HOME}/projects/compagnon_project"
          test -d "${HOME}/projects/compagnon_project" \
            && echo "           PRÉSENT (inattendu sur un runner)" \
            || echo "           ABSENT — attendu : c'est un dépôt privé, ⛔ jamais cloné"
          echo "lvgl     : firmware/desknode/managed_components/lvgl__lvgl"
          test -d firmware/desknode/managed_components/lvgl__lvgl \
            && echo "           PRÉSENT" \
            || echo "           ABSENT — attendu : gitignoré, repeuplé par idf.py reconfigure"

      # 🔴 REVUE DU 2026-09-02 — CE NOM FIGEAIT « 27 », deux lignes au-dessus
      #    du commentaire qui l'interdit. Le compte réel est déjà imprimé par
      #    l'étape précédente (`ls tools/verif_*.py | wc -l`).
      - name: "Passer les gates découvertes par le glob"
        # ⛔ `bash tools/run_gates.sh`, ⛔ PAS une liste de gates : la découverte
        #    par glob est la règle (1) du runner. Une liste écrite se périme le
        #    jour où on ajoute une gate — c'est-à-dire le jour où elle compte.
        # ⛔ AUCUN `continue-on-error`, ⛔ aucun `|| true` : le `rc` du runner
        #    EST le verdict du job.
        run: bash tools/run_gates.sh

      # 🔴 AJOUTÉ LE 2026-09-11 (`dn8-2`) — LE RELEVÉ DE COUVERTURE EST **REJOUÉ**,
      #    ⛔ pas joué une fois puis versé dans une capture. Mesure du
      #    2026-09-11 : le banc rendait `27 OK, 0 KO` pendant que **21 des 93
      #    fonctions** du `<script>` de la page n'étaient JAMAIS entrées.
      #    L'existence d'un banc ⛔ ne vaut pas couverture, et le seul moyen de
      #    le savoir est de MESURER pendant que ça tourne.
      # ⚠️ ⛔ IL N'EST PAS DANS `run_gates.sh`, ET LE MOTIF EST **DE NATURE**, ⛔
      #    pas de coût : `run_gates.sh` découvre `tools/verif_*.py`, et ce relevé
      #    n'en est pas un. ⚠️ **LA LIGNE D'ORIGINE AVANÇAIT UN MOTIF DE COÛT
      #    FAUX, ET ELLE EST CORRIGÉE ICI PLUTÔT QU'EFFACÉE** : elle disait
      #    « ~4 s × 39 tirs ≈ 156 s » sur une marge de « 78,89 s ». Or
      #    `verif_campagne_dn56.py` ne rejoue **que** les `verif_*.py` qui
      #    déclarent `--liste-mutants` — ⛔ jamais `run_gates.sh`, ⛔ donc jamais
      #    ce relevé : le surcoût annoncé n'existait pas. ⇒ il est joué **UNE
      #    FOIS**, ici, à chaque passe.
      # ⛔ AUCUN `continue-on-error`, ⛔ aucun `|| true` : sous son seuil déclaré,
      #    le relevé sort en non-zéro et le job ROUGIT. ⚠️ Et il sort en **3** si
      #    le banc qu'il lance est lui-même rouge — ⛔ aucun chiffre relevé sur
      #    une liste de cas tronquée n'est publié comme une mesure.
      # 🔴 `if: always()` — AJOUTÉ LE 2026-09-12 : sans lui, une gate rouge en
      #    amont sautait cette étape, et la couverture du seul instrument qui
      #    EXÉCUTE la page n'était plus relevée **précisément le jour où quelque
      #    chose casse**. ⇒ elle tourne, et son verdict est le sien.
      - name: "Relever la couverture du <script> exécuté par le banc"
        if: always()
        run: |
          DN_NODE="$(command -v node || true)"
          if [ -n "${DN_NODE}" ]; then
            node tools/banc_couverture_dn82.mjs
          else
            # ⛔ UNE PHRASE **VRAIE**, ET UN AVERTISSEMENT QUE L'INTERFACE MONTRE.
            #    La rédaction d'avant disait « il n'est PAS vert pour autant »
            #    alors que sa dernière commande était un `echo` : l'étape sortait
            #    VERTE en imprimant le contraire. ⇒ `::warning::`, et le fait
            #    exact : ⛔ personne ne relève la couverture sur ce runner.
            echo "::warning::node ABSENT — la couverture du <script> de la page"\
                 "n'est PAS relevée sur ce runner, et verif_banc_langue_dn73.py y"\
                 "est portée NON-JOUABLE par tools/run_gates.sh. ⛔ Aucun seuil de"\
                 "couverture n'est donc gardé par cette passe."
          fi
