## DeskNode P1/P2/P3 — dépendances managées.
##
## Versions ÉPINGLÉES (règle héritée de dn1-1 : on ne prend pas « la dernière »,
## on prend celle qu'on a vue marcher, et on note ce que le lock a résolu).
## `dependencies.lock` reste gitignoré : c'est CE fichier qui fait foi, et il
## épingle des versions exactes — le lock n'apporterait rien de plus.
dependencies:
  idf:
    version: "~5.5.0"

  ## Driver ST7701(S) « 3-wire SPI pour l'init + RGB parallèle pour les pixels ».
  ## ⚠️ Sa séquence d'init intégrée est GÉNÉRIQUE et ne convient pas à cette
  ##    dalle : on lui passe la séquence vendeur via init_cmds (voir
  ##    dn_st7701_init.h). C'est le point où tout le monde se casse les dents.
  espressif/esp_lcd_st7701: "==2.0.2"

  ## Fournit esp_lcd_new_panel_io_3wire_spi() : le bus SPI bit-bangé de l'init,
  ## capable de piloter CS À TRAVERS un IO expander — indispensable ici, LCD_CS
  ## est derrière le TCA9554.
  espressif/esp_lcd_panel_io_additions: "==1.0.1"

  ## L'expander lui-même, à 0x20. LCD_RST et LCD_CS n'existent pas en GPIO direct
  ## sur cette carte : sans lui, pas d'écran du tout.
  espressif/esp_io_expander_tca9554: "==2.0.3"

  ## ── dn1-3 : la couche UI ──────────────────────────────────────────────────
  ## LVGL 9.5.0 — dernière stable au 2026-08-15 (sortie le 2026-02-18), vérifiée
  ## AU REGISTRE, pas dans un article. ⚠️ API v9 : `lv_display_create` /
  ## `lv_display_set_buffers`. Tout tuto qui parle de `lv_disp_drv_t` ou de
  ## `lv_disp_draw_buf_init` est du LVGL 8 et ne compilera pas ici.
  lvgl/lvgl: "==9.5.0"

  ## Le portage Espressif : tick esp_timer, tâche LVGL, mutex, et surtout
  ## `lvgl_port_add_disp_rgb()` qui prend les handles esp_lcd DÉJÀ créés par
  ## dn_display — on ne lui laisse pas refaire le bring-up.
  ## ⚠️ Son option `avoid_tearing` est INUTILISABLE dans notre configuration :
  ##    elle appelle esp_lcd_rgb_panel_get_frame_buffer(panel, 2, ...) et exige
  ##    donc num_fbs >= 2, alors que dn1-2 a ARBITRÉ num_fbs=1 (le double tampon
  ##    ne s'affiche pas sur cette puce sous RESTART_IN_VSYNC=y). D'où le mode
  ##    partiel + flush synchronisé, voir dn_ui.c.
  espressif/esp_lvgl_port: "==2.9.0"

  ## ── dn1-4 : le tactile ────────────────────────────────────────────────────
  ## Driver du Goodix GT911. 1.2.1 = dernière au registre, RE-VÉRIFIÉE le
  ## 2026-08-15 par appel direct à l'API du registre (19 versions listées, 1.2.1
  ## en tête) — pas sur la foi d'un article.
  ##
  ## 🔴 CE QU'IL NE FERA PAS POUR NOUS, et c'est le piège n°4 de cette story :
  ##    TP_RST est derrière le TCA9554, donc on lui passe `rst_gpio_num = -1`. Or
  ##    avec -1 le driver SAUTE toute sa séquence de reset — c'est-à-dire aussi la
  ##    SÉLECTION D'ADRESSE du GT911, qui latche 0x5D ou 0x14 selon le niveau
  ##    d'INT au relâchement du reset. La séquence est donc jouée par dn_touch.c
  ##    AVANT le `new` (cas documenté esp-bsp #130).
  espressif/esp_lcd_touch_gt911: "==1.2.1"

  ## La couche générique dont le GT911 dépend (il déclare `^1.2.0`, donc sans
  ## cette ligne le résolveur prendrait « la dernière », ce que la règle du dépôt
  ## interdit : le manifeste fait foi, le lock est gitignoré). 1.2.1 au registre.
  ## ⚠️ C'est elle qui applique swap_xy/mirror_x/mirror_y EN LOGICIEL, avec
  ##    x_max/y_max comme axe de symétrie : ces quatre champs se règlent ensemble
  ##    ou pas du tout.
  espressif/esp_lcd_touch: "==1.2.1"

  ## ── dn2-1 : le BME680 ──────────────────────────────────────────────────────
  ## SEUL candidat du registre compatible avec CE bus : bme680_init() prend un
  ## `i2c_master_bus_handle_t` DÉJÀ CRÉÉ et fait lui-même l'add_device.
  ## ⛔ Les trois autres candidats sont éliminatoires pour la même raison — ils
  ##    CRÉENT leur propre bus, alors que dn_display possède l'unique bus de la
  ##    carte : esp-idf-lib/bme680 (via esp-idf-lib/i2cdev, driver i2c LEGACY,
  ##    conflit frontal avec i2c_new_master_bus), francisduvivier/bme68x_…
  ##    et espressif/bme690 (via espressif/i2c_bus). ⛔ Et il n'existe AUCUN
  ##    espressif/bme680 — vérifié par appel direct à l'API du registre.
  ## ⚠️ Premier composant du manifeste qui ne vient PAS d'Espressif, et son
  ##    CMakeLists est exotique (include de version.cmake + un bloc de
  ##    régénération par dotnet-gitversion, gardé par des templates absents chez
  ##    nous, donc inerte). À surveiller à chaque mise à jour d'IDF.
  k0i05/esp_bme680: "==1.2.7"
  ## ⚠️ ÉPINGLÉ EXPLICITEMENT BIEN QUE TRANSITIF — correctif de la revue du
  ##    2026-08-17. Le README l'annonçait déjà `==1.2.7` dans sa colonne
  ##    « Épinglé », mais RIEN ne l'épinglait : `esp_bme680` le déclare en
  ##    `>=0.0.1`, et `dependencies.lock` le résolvait comme tel. Or le lock et
  ##    `managed_components/` sont GITIGNORÉS ⇒ ce manifeste est la seule autorité
  ##    versionnée, et elle disait le contraire de la doc. Même précédent assumé
  ##    que `espressif/esp_lcd_touch` : sans cette ligne, le résolveur prend
  ##    « la dernière » — sur la seule chaîne non-Espressif du dépôt.
  k0i05/esp_type_utils: "==1.2.7"
